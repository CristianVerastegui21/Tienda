<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sistema JV</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#f4f6f9;
    overflow-x:hidden;
}

/* SIDEBAR */

.sidebar{

    width:260px;
    height:100vh;

    position:fixed;
    left:0;
    top:0;

    background:linear-gradient(
        180deg,
        #6a11cb,
        #2575fc
    );

    color:white;

    z-index:1000;

    transition:.3s;
}


.logo{

    padding:25px;
    font-size:28px;
    font-weight:bold;
}

.sidebar a{

    color:white;
    text-decoration:none;

    display:block;

    padding:16px 30px;

    font-size:20px;

    transition:.3s;
}

.sidebar a:hover{

    background:rgba(255,255,255,.15);

    padding-left:40px;
}

/* CONTENIDO */

.main{

    margin-left:260px;

    padding:25px;

    transition:.3s;
}

/* BOTON HAMBURGUESA */

.menu-btn{

    display:none;

    border:none;

    font-size:28px;

    background:white;

    border-radius:12px;

    padding:10px 15px;

    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

/* FONDO OSCURO */

.overlay{

    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.5);

    z-index:999;
}

/* MOVIL */

@media(max-width:768px){

.sidebar{

    left:-260px;
}

.sidebar.active{

    left:0;
}

.main{

    margin-left:0;
}

.menu-btn{

display:block;

margin-bottom:20px;
}

.overlay.active{

display:block;
}

}

</style>

</head>

<body>


<div class="overlay"
id="overlay"
onclick="toggleMenu()">
</div>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

<div class="logo">

🏪 Sistema JV

</div>


<a href="/">
<i class="fa fa-house"></i>
Inicio
</a>


<a href="/productos">
<i class="fa fa-box"></i>
Productos
</a>

<a href="/ventas">
<i class="fa fa-cash-register"></i>
Ventas
</a>

<a href="/usuarios">
<i class="fa fa-users"></i>
Usuarios
</a>

<a href="/logs">
<i class="fa fa-clipboard"></i>
Logs
</a>

<a href="/stock_bajo">
<i class="fa fa-triangle-exclamation"></i>
Alertas Stock
</a>

<a href="/historial">
<i class="fa fa-clock-rotate-left"></i>
Historial
</a>

<a href="/reportes">
<i class="fa fa-chart-line"></i>
Reportes
</a>

<a href="/dashboard">
<i class="fa fa-chart-pie"></i>
Dashboard
</a>

<a href="/logout">
<i class="fa fa-right-from-bracket"></i>
Cerrar Sesión
</a>

</div>


<div class="main">

<button
class="menu-btn"
onclick="toggleMenu()">

☰

</button>

{% block content %}
{% endblock %}

</div>


<script>

function toggleMenu(){

document
.getElementById("sidebar")
.classList.toggle("active");

document
.getElementById("overlay")
.classList.toggle("active");

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
