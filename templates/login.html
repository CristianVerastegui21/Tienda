<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Bodega Verastegui</title>

    <!-- Bootstrap -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->

    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">

    <style>

        *{
            font-family: 'Poppins', sans-serif;
        }

        body{

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:
            linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #334155
            );

            overflow:hidden;
        }

        .login-card{

            width:400px;

            padding:40px;

            border-radius:25px;

            background:rgba(255,255,255,0.1);

            backdrop-filter: blur(15px);

            border:1px solid rgba(255,255,255,0.2);

            box-shadow:
            0 8px 32px rgba(0,0,0,0.3);

            animation: aparecer 0.8s ease;
        }

        @keyframes aparecer{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        .titulo{

            text-align:center;

            color:white;

            font-size:32px;

            font-weight:600;

            margin-bottom:10px;
        }

        .subtitulo{

            text-align:center;

            color:#cbd5e1;

            margin-bottom:35px;
        }

        .form-control{

            height:50px;

            border-radius:12px;

            border:none;

            padding-left:45px;
        }

        .input-group{

            position:relative;

            margin-bottom:20px;
        }

        .input-group i{

            position:absolute;

            left:15px;

            top:15px;

            z-index:10;

            color:#64748b;
        }

        .btn-login{

            height:50px;

            border-radius:12px;

            font-weight:600;

            font-size:17px;

            transition:0.3s;
        }

        .btn-login:hover{

            transform:scale(1.03);
        }

        .footer{

            text-align:center;

            color:#cbd5e1;

            margin-top:25px;

            font-size:14px;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="titulo">

        <i class="bi bi-shop"></i>

        Bodega Verastegui

    </div>

    <div class="subtitulo">

        Sistema de Gestión Comercial

    </div>

    <form method="POST">

        <div class="input-group">

            <i class="bi bi-person-fill"></i>

            <input
                type="text"
                name="usuario"
                class="form-control"
                placeholder="Usuario"
                required
            >

        </div>

        <div class="input-group">

            <i class="bi bi-lock-fill"></i>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Contraseña"
                required
            >

        </div>

        <button
            type="submit"
            class="btn btn-primary w-100 btn-login">

            <i class="bi bi-box-arrow-in-right"></i>

            Ingresar

        </button>

    </form>

    <div class="footer">

        © 2026 Bodega Verastegui

    </div>

</div>

</body>
</html>
