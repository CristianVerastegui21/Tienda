{% extends 'layout.html' %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <h2 class="fw-bold mb-4 text-center">

                        ➕ Nuevo Usuario

                    </h2>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Nombre

                            </label>

                            <input
                                type="text"
                                name="nombre"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Usuario

                            </label>

                            <input
                                type="text"
                                name="usuario"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Contraseña

                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Rol

                            </label>

                            <select
                                name="rol"
                                class="form-select"
                            >

                                <option value="admin">
                                    Admin
                                </option>

                                <option value="supervisor">
                                    Supervisor
                                </option>

                                <option value="cajero">
                                    Cajero
                                </option>

                            </select>

                        </div>

                        <button
                            class="btn btn-primary w-100"
                        >

                            💾 Guardar Usuario

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
