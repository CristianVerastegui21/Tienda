<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/minified/html5-qrcode.min.css">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="{{ url_for('static', filename='js/bodega-scanner.js') }}"></script>

<div class="modal fade" id="bodegaScannerModal" tabindex="-1" aria-hidden="true" style="display:none;">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;">
      <div class="modal-header" style="border-color:var(--border);">
        <h5 class="modal-title" style="color:var(--text-primary);font-size:1rem;">
          <i class="fa fa-camera"></i> Escanear codigo
        </h5>
        <button type="button" class="btn-close btn-close-scanner" data-bs-dismiss="scanner" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <p id="bodegaScannerStatus" style="font-size:.8rem;margin-bottom:.75rem;"></p>
        <div id="bodega-qr-reader" style="width:100%;border-radius:10px;overflow:hidden;"></div>
        <p style="font-size:.72rem;color:var(--text-muted);margin-top:.75rem;margin-bottom:0;">
          Compatible con camara del celular o PC, codigos QR, EAN, UPC, Code 128/39 y lectores USB tipo teclado.
        </p>
      </div>
      <div class="modal-footer" style="border-color:var(--border);">
        <button type="button" class="btn btn-outline-secondary btn-close-scanner" data-bs-dismiss="scanner">Cerrar</button>
      </div>
    </div>
  </div>
</div>

<style>
#bodegaScannerModal.show { display:block !important; background:var(--overlay, rgba(0,0,0,.55)); }
#bodegaScannerModal .modal-dialog { max-width:420px; }
</style>
