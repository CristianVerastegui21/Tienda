{% extends 'layout.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <h1 class="fw-bold text-center mb-5">

                        ✏ Editar Producto

                    </h1>

                    <form method="POST">

                        <!-- NOMBRE -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Nombre

                            </label>

                            <input
                                type="text"
                                name="nombre"
                                class="form-control form-control-lg"
                                value="{{ producto.nombre }}"
                                required
                            >

                        </div>

                        <!-- PRECIO -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Precio

                            </label>

                            <input
                                type="number"
                                step="0.01"
                                name="precio"
                                class="form-control form-control-lg"
                                value="{{ producto.precio }}"
                                required
                            >

                        </div>

                        <!-- STOCK -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Stock

                            </label>

                            <input
                                type="number"
                                name="stock"
                                class="form-control form-control-lg"
                                value="{{ producto.stock }}"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">

                                Punto de Reorden

                            </label>

                            <input
                                type="number"
                                name="reorden"
                                class="form-control"
                                value="{{ producto.reorden }}"
                                min="1"
                                required
                            >

                        </div>
                        <!-- CODIGO -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Código de Barras

                            </label>

                            <input
                                type="text"
                                name="codigo"
                                class="form-control form-control-lg"
                                value="{{ producto.codigo_barra }}"
                            >

                        </div>

                        <!-- BOTONES -->

                        <div class="d-grid gap-3">

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg"
                            >

                                💾 Guardar Cambios

                            </button>

                            <a
                                href="/productos"
                                class="btn btn-outline-secondary"
                            >

                                ← Volver

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
