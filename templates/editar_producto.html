{% extends 'layout.html' %}
{% block content %}

<style>
  .form-card{max-width:620px;margin:0 auto}
  .form-section{margin-bottom:1.4rem}
  .form-section-title{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:.8rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
  .back-link{display:inline-flex;align-items:center;gap:.4rem;color:var(--text-muted);font-size:.82rem;text-decoration:none;margin-bottom:1.25rem;transition:color .2s}
  .back-link:hover{color:var(--text-primary)}
</style>

<a href="/productos" class="back-link"><i class="fa fa-arrow-left"></i> Volver a Productos</a>

<div class="form-card">
  <div class="page-header" style="margin-bottom:1.25rem">
    <div>
      <h1 class="page-title">✏ Editar Producto</h1>
      <p class="page-sub">Modifica los datos del producto #{{ producto.id }}</p>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="POST">

        <div class="form-section">
          <div class="form-section-title">Información básica</div>
          <div class="mb-3">
            <label class="form-label">Nombre del Producto</label>
            <input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:.9rem">
            <div>
              <label class="form-label">Precio (S/.)</label>
              <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio }}" required>
            </div>
            <div>
              <label class="form-label">Entradas</label>
              <input type="number" name="entradas" class="form-control" value="0" required>
            </div>
            <div>
              <label class="form-label">Stock Actual</label>
             <input type="number" class="form-control" value="{{ producto.stock }}" readonly >
              <small class="text-muted">
                  El stock se actualiza automáticamente mediante Entradas.
              </small>
            </div>
            <div>
              <label class="form-label">Salidas</label>
              <input type="number" name="salidas" class="form-control" value="0" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Categoría</label>

            <select name="categoria_id" class="form-select">
                <option value="">Seleccionar categoría </option>

                {% for categoria in categorias %}
                <option value="{{ categoria.id }}" {% if producto.categoria_id == categoria.id %}selected {% endif %}>
                    {{ categoria.nombre }}
                </option>
                {% endfor %}
            </select>
         </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">Configuración de stock</div>
          <div>
            <label class="form-label">Punto de Reorden</label>
            <input type="number" name="reorden" class="form-control" value="{{ producto.reorden }}" min="1" required>
          </div>
        </div>

        

        <div class="form-section">
          <div class="form-section-title">Código de barras</div>
          <input type="text" name="codigo" class="form-control" value="{{ producto.codigo_barra }}">
        </div>

        <div style="display:flex;gap:.75rem;margin-top:.5rem">
          <button type="submit" class="btn btn-warning" style="flex:1"><i class="fa fa-floppy-disk"></i> Guardar Cambios</button>
          <a href="/productos" class="btn btn-outline-secondary">Cancelar</a>
        </div>

      </form>
    </div>
  </div>
</div>

{% endblock %}
